[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dkbsign-sdk"
version = "0.1.0"
description = "Python SDK for the DKB Sign API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["dkbsign*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
